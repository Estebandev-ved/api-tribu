# ==========================================
# NGINX CONFIGURATION - TRIBU E-COMMERCE
# ==========================================
server {
    listen 80;
    # Cambiar por tu dominio real
    server_name tudominio.com www.tudominio.com;

    # Permitir subir archivos de hasta 10MB
    client_max_body_size 10M;

    root /var/www/tribu-frontend/dist;
    index index.html;

    # Compresión de archivos para rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Ubicación Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ubicación Backend (API)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxear websockets si usas
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Ubicación Uploads (Imágenes)
    location /uploads/ {
        # Si Spring maneja esto, podrías dejar que pase como /api/uploads/
        # Si prefieres que Nginx sirva los estáticos directo (más rápido):
        alias /ruta/absoluta/a/tu/app/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
