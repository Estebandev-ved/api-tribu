# =============================================
# TRIBU E-COMMERCE — CONFIGURACIÓN DE PRODUCCIÓN
# =============================================

# BASE DE DATOS
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tribu_db?useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:tribu_app_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# FLYWAY (migraciones automáticas)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# HIBERNATE/JPA (Seguridad ante todo, NUNCA UPDATE en PRD sin supervisión)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SERVIDOR
server.port=8080

# JWT
# Configurado por variables de entorno
jwt.secret=${JWT_SECRET:7xVUR3ikA6OeM75Hds07urEBieVmi4EzmdlHOKtjjKydimiXwwDOKlgYfKEvhJm20bXQo2X9h8cA4MaHnFxfRQ==}
jwt.expiration=86400000

# CORREO (SMTP Seguro)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:admin@tribu.com}
spring.mail.password=${MAIL_PASSWORD:aqui-tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ARCHIVOS (Ajustes de memoria para producción)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# NOTIFICACIONES WEB PUSH
