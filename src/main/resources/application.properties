# =============================================
# TRIBU E-COMMERCE — CONFIGURACIÓN DE BASE DE DATOS
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/tribu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# SERVIDOR
# =============================================
server.port=8080

# =============================================
# JWT
# =============================================
jwt.secret=${JWT_SECRET:TribuEcommerceSecretKeyMuySuperSegura2024PutumayoColombia}
jwt.expiration=86400000

# =============================================
# EMAIL (Gmail SMTP)
# IMPORTANTE: usa una App Password de Google, no tu contraseña normal
# Ir a: https://myaccount.google.com/apppasswords
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tribuindustrias@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-app-password-de-16-caracteres}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================
# SUBIDA DE ARCHIVOS (imágenes)
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# =============================================
# SPRING SECURITY (desactiva form login, usamos JWT)
# =============================================
spring.security.user.name=admin
spring.security.user.password=admin

# =============================================
# TELEGRAM BOT ADMIN
# =============================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=TribuCardAdminBot
telegram.bot.admin.chat.ids=${TELEGRAM_ADMIN_CHAT_IDS:}

# =============================================
# VAPID KEYS PARA WEB PUSH (generar con: npx web-push generate-vapid-keys)
# =============================================
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=mailto:admin@tribucard.com

# =============================================
# PUNTOS TRIBU
# =============================================
tribu.puntos.expiran=false
tribu.puntos.expiracion.dias=365

# =============================================
# RESEND EMAIL CONFIGURATION
# =============================================
resend.api.key=${RESEND_API_KEY:re_default}
resend.from.seguridad=${RESEND_FROM_SEGURIDAD:Tribu Seguridad <onboarding@resend.dev>}
resend.from.pedidos=${RESEND_FROM_PEDIDOS:Tribu Pedidos <onboarding@resend.dev>}
resend.from.facturas=${RESEND_FROM_FACTURAS:Tribu Facturacion <onboarding@resend.dev>}
resend.from.marketing=${RESEND_FROM_MARKETING:Tribu Novedades <onboarding@resend.dev>}

# =============================================
# GOOGLE LOGIN (OAUTH 2.0)
# =============================================
google.client.id=${GOOGLE_CLIENT_ID:}

# =============================================
# EFIPAY PAYMENT GATEWAY
# =============================================
efipay.api.key=${EFIPAY_API_KEY:}
efipay.webhook.token=${EFIPAY_WEBHOOK_TOKEN:}
efipay.office.id=${EFIPAY_OFFICE_ID:3161}
efipay.commerce.id=${EFIPAY_COMMERCE_ID:2721}
efipay.api.url=${EFIPAY_API_URL:https://sag.efipay.co/api/v1}
efipay.webhook.url=${EFIPAY_WEBHOOK_URL:https://tribucol.shop/api/webhook/efipay/transaction}
efipay.app.base.url=${EFIPAY_APP_BASE_URL:https://tribucol.shop}

